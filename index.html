<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-7xl p-6 bg-white shadow-2xl rounded-lg">
        <!-- Tab Navigation -->
        <div class="flex space-x-4 border-b pb-2 mb-6">
            <button onclick="showTab('exposSection')" class="tab-button px-4 py-2 text-gray-700 hover:text-blue-500 focus:outline-none border-b-2 border-transparent">Expos</button>
            <button onclick="showTab('studentsSection')" class="tab-button px-4 py-2 text-gray-700 hover:text-blue-500 focus:outline-none border-b-2 border-transparent">Students</button>
            <button onclick="showTab('projectsSection')" class="tab-button px-4 py-2 text-gray-700 hover:text-blue-500 focus:outline-none border-b-2 border-transparent">Projects</button>
            <button onclick="showTab('studentProjectsSection')" class="tab-button px-4 py-2 text-gray-700 hover:text-blue-500 focus:outline-none border-b-2 border-transparent">Student Projects</button>
            <button onclick="showTab('codeSection')" class="tab-button px-4 py-2 text-gray-700 hover:text-blue-500 focus:outline-none border-b-2 border-transparent">Codes</button>
        </div>

        <!-- Sections -->
        <div id="exposSection" class="tab-content hidden">
            <h2 class="text-xl font-semibold mb-4">Expos Management</h2>
            <button class="py-2.5 px-5 me-2 mb-2 text-sm font-bold text-gray-900 focus:outline-none bg-white rounded-full border border-gray-200 hover:bg-gray-100 hover:text-blue-700 focus:z-10 focus:ring-4 focus:ring-gray-100 dark:focus:ring-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-600 dark:hover:text-white dark:hover:bg-gray-700" onclick="loadExpos()"> Load Expos
            </button>
            <div id="exposList" class="mt-4"></div>

            <h3 class="text-lg font-medium mt-6">Create Expo</h3>
            <div class="space-y-4 mt-2">
                <input id="expoTitle" type="text" placeholder="Title" class="w-full p-2 border rounded">
                <input id="expoLocation" type="text" placeholder="Location" class="w-full p-2 border rounded">
                <input id="expoMoment" type="text" placeholder="Moment" class="w-full p-2 border rounded">
                <input id="expoCohort" type="text" placeholder="Cohort" class="w-full p-2 border rounded">
                <button class="py-2.5 px-5 me-2 mb-2 text-sm font-bold text-gray-900 focus:outline-none bg-white rounded-full border border-gray-200 hover:bg-gray-100 hover:text-blue-700 focus:z-10 focus:ring-4 focus:ring-gray-100 dark:focus:ring-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-600 dark:hover:text-white dark:hover:bg-gray-700" onclick="createExpo()">Create Expo</button>
            </div>
        </div>

        <div id="studentsSection" class="tab-content hidden">
            <h2 class="text-xl font-semibold mb-4">Students Management</h2>
            <button class="py-2.5 px-5 me-2 mb-2 text-sm font-bold text-gray-900 focus:outline-none bg-white rounded-full border border-gray-200 hover:bg-gray-100 hover:text-blue-700 focus:z-10 focus:ring-4 focus:ring-gray-100 dark:focus:ring-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-600 dark:hover:text-white dark:hover:bg-gray-700" onclick="loadStudents()">Load Students</button>
            <div id="studentsList" class="mt-4"></div>

            <h3 class="text-lg font-medium mt-6">Create Student</h3>
            <div class="space-y-4 mt-2">
                <input id="studentFullName" type="text" placeholder="Full Name" class="w-full p-2 border rounded">
                <input id="studentEmail" type="email" placeholder="Email" class="w-full p-2 border rounded">
                <input id="studentCohort" type="text" placeholder="Cohort" class="w-full p-2 border rounded">
                <input id="studentDuoNumber" type="number" placeholder="Duo Number" class="w-full p-2 border rounded">
                <button class="py-2.5 px-5 me-2 mb-2 text-sm font-bold text-gray-900 focus:outline-none bg-white rounded-full border border-gray-200 hover:bg-gray-100 hover:text-blue-700 focus:z-10 focus:ring-4 focus:ring-gray-100 dark:focus:ring-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-600 dark:hover:text-white dark:hover:bg-gray-700" onclick="createStudent()">Create Student</button>
            </div>
        </div>

        <div id="projectsSection" class="tab-content hidden">
            <h2 class="text-xl font-semibold mb-4">Projects Management</h2>
            <button class="py-2.5 px-5 me-2 mb-2 text-sm font-bold text-gray-900 focus:outline-none bg-white rounded-full border border-gray-200 hover:bg-gray-100 hover:text-blue-700 focus:z-10 focus:ring-4 focus:ring-gray-100 dark:focus:ring-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-600 dark:hover:text-white dark:hover:bg-gray-700" onclick="loadProjects()">Load Projects</button>
            <div id="projectsList" class="mt-4"></div>

            <h3 class="text-lg font-medium mt-6">Create Project</h3>
            <div class="space-y-4 mt-2">
                <input id="projectTitle" type="text" placeholder="Project Title" class="w-full p-2 border rounded">
                <input id="projectSubscription" type="text" placeholder="Subscription" class="w-full p-2 border rounded">
                <input id="projectImageURL" type="text" placeholder="Image URL" class="w-full p-2 border rounded">
                <input id="projectExpoId" type="number" placeholder="Expo ID" class="w-full p-2 border rounded">
                <button class="py-2.5 px-5 me-2 mb-2 text-sm font-bold text-gray-900 focus:outline-none bg-white rounded-full border border-gray-200 hover:bg-gray-100 hover:text-blue-700 focus:z-10 focus:ring-4 focus:ring-gray-100 dark:focus:ring-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-600 dark:hover:text-white dark:hover:bg-gray-700" onclick="createProject()">Create Project</button>
            </div>
        </div>

        <div id="studentProjectsSection" class="tab-content hidden">
            <h2 class="text-xl font-semibold mb-4">Student Projects Management</h2>
            <button class="py-2.5 px-5 me-2 mb-2 text-sm font-bold text-gray-900 focus:outline-none bg-white rounded-full border border-gray-200 hover:bg-gray-100 hover:text-blue-700 focus:z-10 focus:ring-4 focus:ring-gray-100 dark:focus:ring-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-600 dark:hover:text-white dark:hover:bg-gray-700" onclick="loadStudentProjects()">Load Student Projects</button>
            <div id="studentProjectsList" class="mt-4"></div>

            <h3 class="text-lg font-medium mt-6">Assign Project to Student</h3>
            <div class="space-y-4 mt-2">
                <input id="studentId" type="number" placeholder="Student ID" class="w-full p-2 border rounded">
                <input id="projectId" type="number" placeholder="Project ID" class="w-full p-2 border rounded">
                <button class="py-2.5 px-5 me-2 mb-2 text-sm font-bold text-gray-900 focus:outline-none bg-white rounded-full border border-gray-200 hover:bg-gray-100 hover:text-blue-700 focus:z-10 focus:ring-4 focus:ring-gray-100 dark:focus:ring-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-600 dark:hover:text-white dark:hover:bg-gray-700" onclick="assignStudentToProject()">Assign Student to Project</button>
            </div>
        </div>

        <div id="codeSection" class="tab-content hidden">
            <h2 class="text-xl font-semibold mb-4">Generate and Verify Codes</h2>
            <div class="space-y-4 mt-2">
                <input id="verifyEmail" type="email" placeholder="Email" class="w-full p-2 border rounded">
                <input id="verificationCode" type="text" placeholder="Code" class="w-full p-2 border rounded">
                <button class="py-2.5 px-5 me-2 mb-2 text-sm font-bold text-gray-900 focus:outline-none bg-white rounded-full border border-gray-200 hover:bg-gray-100 hover:text-blue-700 focus:z-10 focus:ring-4 focus:ring-gray-100 dark:focus:ring-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-600 dark:hover:text-white dark:hover:bg-gray-700" onclick="generateCode()">Generate Code</button>
                <button class="py-2.5 px-5 me-2 mb-2 text-sm font-bold text-gray-900 focus:outline-none bg-white rounded-full border border-gray-200 hover:bg-gray-100 hover:text-blue-700 focus:z-10 focus:ring-4 focus:ring-gray-100 dark:focus:ring-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-600 dark:hover:text-white dark:hover:bg-gray-700" onclick="verifyCode()">Verify Code</button>
            </div>
        </div>
    </div>

    <script>
        const apiUrl = "https://apiexpo-production.up.railway.app/";

        function showTab(sectionId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.add('hidden'));
            document.getElementById(sectionId).classList.remove('hidden');
        }

        async function fetchData(endpoint, method = 'GET', body = null) {
            const options = {
                method,
                headers: { 'Content-Type': 'application/json' },
            };
            if (body) options.body = JSON.stringify(body);
            const response = await fetch(apiUrl + endpoint, options);
            return response.json();
        }

        function loadExpos() {
            fetchData('expos')
                .then(expos => {
                    const exposList = document.getElementById('exposList');
                    exposList.innerHTML = '';
                    expos.forEach(expo => {
                        exposList.innerHTML += `<div class='p-2 border-b'>${expo.title} - ${expo.location}</div>`;
                    });
                });
        }

        function createExpo() {
            const expo = {
                title: document.getElementById('expoTitle').value,
                location: document.getElementById('expoLocation').value,
                moment: document.getElementById('expoMoment').value,
                cohort: document.getElementById('expoCohort').value,
            };
            fetchData('expos', 'POST', expo)
                .then(() => {
                    alert("Expo Created!");
                    loadExpos();
                });
        }

        function loadStudents() {
            fetchData('students')
                .then(students => {
                    const studentsList = document.getElementById('studentsList');
                    studentsList.innerHTML = '';
                    students.forEach(student => {
                        studentsList.innerHTML += `<div class='p-2 border-b'>${student.fullName} - ${student.email}</div>`;
                    });
                });
        }

        function createStudent() {
            const student = {
                fullName: document.getElementById('studentFullName').value,
                email: document.getElementById('studentEmail').value,
                cohort: document.getElementById('studentCohort').value,
                duoNumber: document.getElementById('studentDuoNumber').value,
            };
            fetchData('students', 'POST', student)
                .then(() => {
                    alert("Student Created!");
                    loadStudents();
                });
        }

        function loadProjects() {
            fetchData('projects')
                .then(projects => {
                    const projectsList = document.getElementById('projectsList');
                    projectsList.innerHTML = '';
                    projects.forEach(project => {
                        projectsList.innerHTML += `<div class='p-2 border-b'>${project.title} - ${project.subscription}</div>`;
                    });
                });
        }

        function createProject() {
            const project = {
                title: document.getElementById('projectTitle').value,
                subscription: document.getElementById('projectSubscription').value,
                imageURL: document.getElementById('projectImageURL').value,
                expoId: document.getElementById('projectExpoId').value,
            };
            fetchData('projects', 'POST', project)
                .then(() => {
                    alert("Project Created!");
                    loadProjects();
                });
        }

        function loadStudentProjects() {
            fetchData('studentProjects')
                .then(studentProjects => {
                    const studentProjectsList = document.getElementById('studentProjectsList');
                    studentProjectsList.innerHTML = '';
                    studentProjects.forEach(sp => {
                        studentProjectsList.innerHTML += `<div class='p-2 border-b'>Student ID: ${sp.studentId} - Project ID: ${sp.projectId}</div>`;
                    });
                });
        }

        function assignStudentToProject() {
            const assignment = {
                studentId: document.getElementById('studentId').value,
                projectId: document.getElementById('projectId').value,
            };
            fetchData('studentProjects', 'POST', assignment)
                .then(() => {
                    alert("Student Assigned to Project!");
                    loadStudentProjects();
                });
        }

        function generateCode() {
            const email = document.getElementById('verifyEmail').value;
            fetchData('generateCode', 'POST', { email })
                .then(() => {
                    alert("Code Generated!");
                });
        }

        function verifyCode() {
            const email = document.getElementById('verifyEmail').value;
            const code = document.getElementById('verificationCode').value;
            fetchData('verifyCode', 'POST', { email, code })
                .then(response => {
                    if (response.success) {
                        alert("Code Verified!");
                    } else {
                        alert("Invalid Code!");
                    }
                });
        }

        // Show the first tab by default
        showTab('exposSection');
    </script>
</body>
</html>
